name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # runs the contributors' build scripts, so it gets no secrets
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # a push that only touches presets/ and dev/presets/ skips the WebCLAPs and the screenshots
      - name: Scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt" 2>/dev/null \
            && [ -s "$RUNNER_TEMP/changed.txt" ] && ! grep -qvE '^(dev/)?presets/' "$RUNNER_TEMP/changed.txt"; then
            echo "presets_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "presets_only=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/changed.txt" 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.scope.outputs.presets_only != 'true'
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache
      - uses: actions/checkout@v4
        if: steps.scope.outputs.presets_only != 'true'
        with:
          repository: free-audio/clap
          ref: a47f6badb49d948fd009998f28309cdab78979c9
          path: .clap
          persist-credentials: false
      - name: Install
        working-directory: tools
        run: npm ci
      - name: Validator tests
        working-directory: tools
        run: npm test
      - name: Install Chromium for the device screenshots
        if: steps.scope.outputs.presets_only != 'true'
        working-directory: tools
        run: npx playwright install --with-deps chromium
      - name: Validate, build and render screenshots
        working-directory: tools
        env:
          CLAP_INCLUDE: ${{ github.workspace }}/.clap/include
          PRESETS_ONLY: ${{ steps.scope.outputs.presets_only }}
        run: |
          if [ "$PRESETS_ONLY" = "true" ]; then
            npx tsx src/deploy.ts --root .. --build --out "$RUNNER_TEMP/community" --presets-only --drop-unchanged
          else
            npx tsx src/deploy.ts --root .. --build --out "$RUNNER_TEMP/community" --screenshots https://opendaw.studio --drop-unchanged
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: community
          path: ${{ runner.temp }}/community
          retention-days: 7

  # only uploads what the build job produced, with the tools of this commit
  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install
        working-directory: tools
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: community
          path: ${{ runner.temp }}/community
      - name: Upload
        working-directory: tools
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH || '/community' }}
        run: npx tsx src/deploy.ts --upload --out "$RUNNER_TEMP/community" --remote "$REMOTE_PATH"
